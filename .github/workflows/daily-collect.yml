name: Daily Job Radar Pipeline

on:
  schedule:
    # 每天北京时间早晨 6:30 (UTC 22:30) 自动触发
    - cron: '30 22 * * *'
  # 支持在 GitHub 网页上随时手动点击运行测试
  workflow_dispatch:
  # 每次你向 main 分支推送代码时自动构建部署
  push:
    branches:
      - main

concurrency:
  group: job-radar-pipeline
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 缓存增量采集历史，避免每天重复全量抓取
      - name: Cache Collector State
        uses: actions/cache@v4
        with:
          path: data
          key: collector-state-${{ github.run_id }}
          restore-keys: |
            collector-state-

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Job Collector
        env:
          JOB_RADAR_SCHEDULE_ENABLED: 'true'
        run: |
          python scripts/collect.py --pages 5 --days 14

      - name: Build Web Application
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
