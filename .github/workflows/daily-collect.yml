name: Daily Job Radar Pipeline

on:
  schedule:
    # 每天北京时间 11:00 (UTC 03:00) 自动触发
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      baseline_diagnostic:
        description: '仅诊断 NAS 基线下载：不采集、不构建、不发布（优先于仅发布选项）'
        type: boolean
        default: false
      include_universities_b:
        description: '采集高校分片（NAS 离线时取消勾选，保留高校历史记录）'
        type: boolean
        default: true
      deploy_only:
        description: '仅发布页面，复用线上数据，不启动采集'
        type: boolean
        default: false

concurrency:
  group: job-radar-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  JOB_RADAR_SCHEDULE_ENABLED: 'true'

jobs:
  # Restore one consistent historical baseline before the collection fan-out.
  prepare-baseline:
    outputs:
      universities_sha256: ${{ steps.compact.outputs.baseline_sha256 }}
    if: ${{ (inputs.baseline_diagnostic || !inputs.deploy_only) && (github.event_name != 'schedule' || vars.RUN_SCHEDULED_COLLECTION != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check diagnostic configuration
        if: ${{ inputs.baseline_diagnostic && (vars.UNIVERSITIES_B_RUNNER != 'nas' || !github.event.repository.private) }}
        run: |
          echo '::error::NAS 下载诊断要求私有仓库且 UNIVERSITIES_B_RUNNER=nas。'
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Collector State
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/published-baseline.json
          key: collector-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            collector-state-v3-

      - name: Restore Published Baseline
        run: python scripts/ci_collect.py prepare --site https://sites-project.job-radar.workers.dev

      - name: Prepare universities-only baseline
        id: compact
        run: python scripts/shard_baseline.py prepare --source data/state.json --output data/universities-baseline

      - name: Upload universities-only baseline
        uses: actions/upload-artifact@v4
        with:
          name: collector-baseline-universities-b
          path: data/universities-baseline/*.json
          compression-level: 6
          if-no-files-found: error
          retention-days: 2

      - name: Upload Collector Baseline
        if: ${{ !inputs.baseline_diagnostic }}
        uses: actions/upload-artifact@v4
        with:
          name: collector-baseline
          path: |
            data/state.json
            data/ci-baseline.json
          retention-days: 2

  quality:
    if: ${{ !inputs.baseline_diagnostic && (github.event_name != 'schedule' || vars.RUN_SCHEDULED_COLLECTION != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test Collector and Publication Guards
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and Lint Frontend
        run: |
          node --experimental-strip-types --test tests/*.test.ts
          npm run lint
          npx tsc --noEmit

      - name: Build Web Application
        run: npm run build

      - name: Upload Built Application
        uses: actions/upload-artifact@v4
        with:
          name: built-application
          path: |
            dist
            !dist/client/jobs.json
            !dist/client/snapshot-manifest.json
            !dist/client/job-assets
            !dist/client/job-assets/**
          include-hidden-files: true
          retention-days: 2

  # Each shard starts from the same baseline and only updates its own sources.
  # Four concurrent runners keep wall-clock time bounded without hammering sites.
  collect-shards:
    if: ${{ !inputs.baseline_diagnostic }}
    needs: [prepare-baseline]
    runs-on: ${{ fromJSON(matrix.pack == 'universities-b' && vars.UNIVERSITIES_B_RUNNER == 'nas' && '["self-hosted","linux","job-radar-nas"]' || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pack: ${{ fromJSON(github.event_name == 'workflow_dispatch' && !inputs.include_universities_b && '["regional-official","universities-a","finance","large-enterprises","public-leads"]' || '["regional-official","universities-a","universities-b","finance","large-enterprises","public-leads"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        if: ${{ matrix.pack != 'universities-b' || vars.UNIVERSITIES_B_RUNNER != 'nas' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        if: ${{ matrix.pack != 'universities-b' || vars.UNIVERSITIES_B_RUNNER != 'nas' }}
        run: python -m pip install -r requirements.txt

      - name: Start baseline download timer
        run: echo "BASELINE_DOWNLOAD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download Collector Baseline
        id: baseline_download
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.pack == 'universities-b' && 'collector-baseline-universities-b' || 'collector-baseline' }}
          path: data

      - name: Verify universities baseline before collection
        if: ${{ matrix.pack == 'universities-b' }}
        env:
          EXPECTED_BASELINE_SHA256: ${{ needs.prepare-baseline.outputs.universities_sha256 }}
        run: python3 scripts/shard_baseline.py verify --directory data --expected-sha256 "$EXPECTED_BASELINE_SHA256"

      - name: Explain baseline download failure
        if: ${{ failure() && steps.baseline_download.outcome == 'failure' }}
        run: echo '基线下载失败或超过 5 分钟；本分片未开始采集，合并时保留历史。请查看下载日志中的连接错误和压缩产物大小。' >> "$GITHUB_STEP_SUMMARY"

      - name: Run Collector Shard
        if: ${{ matrix.pack != 'universities-b' || vars.UNIVERSITIES_B_RUNNER != 'nas' }}
        id: collector
        env:
          JOB_RADAR_SCHEDULE_ENABLED: 'true'
        run: |
          # The wrapper accepts partial source failures and still preserves the shard state.
          python scripts/ci_collect.py collect \
            --data-dir data \
            --public-dir public \
            --source-pack "${{ matrix.pack }}" \
            --pages 5 \
            --days 30 \
            --refresh-hours 72 \
            --detail-timeout 8 \
            --detail-retries 1 \
            --detail-failure-limit 6 \
            --source-budget 180 \
            --shard-budget 1080

      - name: Set up NAS Python environment
        if: ${{ matrix.pack == 'universities-b' && vars.UNIVERSITIES_B_RUNNER == 'nas' }}
        run: |
          python3 -c "import sys; assert sys.version_info >= (3, 12)"
          python3 -m venv .nas-venv
          .nas-venv/bin/python -m pip install --retries 2 --timeout 20 -r requirements.txt

      - name: Collect universities on NAS directly
        id: nas_collector
        if: ${{ matrix.pack == 'universities-b' && vars.UNIVERSITIES_B_RUNNER == 'nas' }}
        env:
          NO_PROXY: '*'
        run: |
          export no_proxy="$NO_PROXY"
          .nas-venv/bin/python scripts/ci_collect.py collect \
            --source-pack universities-b --data-dir data --public-dir public \
            --pages 2 --days 30 --refresh-hours 72 --probe-budget 1 \
            --detail-timeout 8 --detail-retries 1 --detail-failure-limit 6 \
            --source-budget 120 --shard-budget 1500

      - name: Upload Shard State
        timeout-minutes: 3
        if: ${{ always() && (steps.collector.outcome == 'success' || steps.collector.outcome == 'failure' || steps.nas_collector.outcome == 'success' || steps.nas_collector.outcome == 'failure') && hashFiles('data/state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: collector-shard-${{ matrix.pack }}
          path: |
            data/state.json
            data/ci-report.json
          retention-days: 2

  baseline-diagnostic:
    needs: [prepare-baseline]
    if: ${{ inputs.baseline_diagnostic && vars.UNIVERSITIES_B_RUNNER == 'nas' && github.event.repository.private }}
    runs-on: [self-hosted, linux, job-radar-nas]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Start baseline download timer
        run: echo "BASELINE_DOWNLOAD_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Download universities baseline (maximum 5 minutes)
        id: download
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: collector-baseline-universities-b
          path: data/diagnostic-baseline
      - name: Verify downloaded baseline and report
        env:
          EXPECTED_BASELINE_SHA256: ${{ needs.prepare-baseline.outputs.universities_sha256 }}
        run: python3 scripts/shard_baseline.py verify --directory data/diagnostic-baseline --expected-sha256 "$EXPECTED_BASELINE_SHA256"
      - name: Explain failed download
        if: ${{ failure() && steps.download.outcome == 'failure' }}
        run: echo '高校基线下载失败或超过 5 分钟。没有进行采集或发布；请展开下载日志排查网络。' >> "$GITHUB_STEP_SUMMARY"

  merge-and-deploy:
    needs: [prepare-baseline, quality, collect-shards]
    if: ${{ !cancelled() && !inputs.baseline_diagnostic && (needs.prepare-baseline.result == 'success' || inputs.deploy_only) && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        if: ${{ !inputs.deploy_only }}
        run: python -m pip install -r requirements.txt

      - name: Download Collector Baseline
        if: ${{ !inputs.deploy_only }}
        uses: actions/download-artifact@v4
        with:
          name: collector-baseline
          path: data

      - name: Download Collector Shards
        if: ${{ !inputs.deploy_only }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: collector-shard-*
          path: data/shards
          merge-multiple: false

      - name: Merge Collector Shards
        if: ${{ !inputs.deploy_only }}
        id: merge
        run: |
          python scripts/ci_collect.py merge \
            --data-dir data \
            --public-dir public \
            --shards-dir data/shards \
            --days 30 \
            --expected-shards "regional-official,universities-a,universities-b,finance,large-enterprises,public-leads"

      - name: Restore exact live snapshot for page-only deployment
        if: ${{ inputs.deploy_only }}
        run: python scripts/download_public.py --site https://sites-project.job-radar.workers.dev --public-dir data/live-public

      - name: Save Collector State
        if: ${{ always() && steps.merge.outcome == 'success' && hashFiles('data/state.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/published-baseline.json
          key: collector-state-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Collection Diagnostics
        if: ${{ always() && hashFiles('data/ci-report.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: collection-report-${{ github.run_attempt }}
          path: |
            data/ci-report.json
            data/coverage-changes.json
          retention-days: 7

      - name: Download Built Application
        uses: actions/download-artifact@v4
        with:
          name: built-application
          path: dist

      - name: Attach Validated Data to Application
        run: python scripts/stage_public.py --public-dir ${{ inputs.deploy_only && 'data/live-public' || 'public' }} --dist-dir dist

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes --package wrangler@4.92.0 wrangler deploy --config dist/server/wrangler.json --keep-vars
