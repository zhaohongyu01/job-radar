name: Daily Job Radar Pipeline

on:
  schedule:
    # 每天北京时间 05:00 (UTC 21:00) 与 14:00 (UTC 06:00) 自动触发
    - cron: '0 6,21 * * *'
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: '复用已完成采集的运行 ID，仅重新合并发布（不重新采集）；留空为正常采集'
        type: string
        default: ''
      deploy_only:
        description: '仅发布页面，复用线上数据，不启动采集'
        type: boolean
        default: false

concurrency:
  group: job-radar-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  JOB_RADAR_SCHEDULE_ENABLED: 'true'

jobs:
  # Restore one consistent historical baseline before the collection fan-out.
  prepare-baseline:
    if: ${{ !inputs.reuse_run_id && !inputs.deploy_only && (github.event_name != 'schedule' || vars.RUN_SCHEDULED_COLLECTION != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trigger NAS Universities Pipeline on manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'nas-universities.yml',
                ref: context.ref,
              });
              core.info('Successfully triggered NAS Universities Pipeline');
            } catch (error) {
              core.warning(`Failed to trigger NAS Universities Pipeline: ${error.message}`);
            }

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Collector State
        uses: actions/cache/restore@v6
        with:
          path: |
            data/state.json
            data/published-baseline.json
          key: collector-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            collector-state-v3-

      - name: Restore Published Baseline
        run: python scripts/ci_collect.py prepare --site https://sites-project.job-radar.workers.dev

      - name: Upload Collector Baseline
        uses: actions/upload-artifact@v7
        with:
          name: collector-baseline
          path: |
            data/state.json
            data/ci-baseline.json
          retention-days: 2

  quality:
    if: ${{ github.event_name != 'schedule' || vars.RUN_SCHEDULED_COLLECTION != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate recovery options
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
        run: |
          python3 -c "import os; run=os.environ.get('REUSE_RUN_ID',''); assert not run or (run.isascii() and run.isdecimal()), 'Recovery run ID must contain digits only'; assert not run or os.environ.get('DEPLOY_ONLY') != 'true', 'Do not combine recovery with deploy_only'"
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test Collector and Publication Guards
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and Lint Frontend
        run: |
          node --experimental-strip-types --test tests/*.test.ts
          npm run lint
          npx tsc --noEmit

      - name: Build Web Application
        run: npm run build

      - name: Upload Built Application
        uses: actions/upload-artifact@v7
        with:
          name: built-application
          path: |
            dist
            !dist/client/jobs.json
            !dist/client/first-screen.json
            !dist/client/snapshot-manifest.json
            !dist/client/job-assets
            !dist/client/job-assets/**
          include-hidden-files: true
          retention-days: 2

  # Five concurrent cloud runners keep wall-clock time bounded and collect cleanly.
  collect-shards:
    if: ${{ !inputs.reuse_run_id }}
    needs: [prepare-baseline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        pack: ["regional-official", "universities-a", "finance", "large-enterprises", "public-leads"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Start baseline download timer
        run: echo "BASELINE_DOWNLOAD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download Collector Baseline
        id: baseline_download
        timeout-minutes: 5
        uses: actions/download-artifact@v8
        with:
          name: collector-baseline
          path: data

      - name: Run Collector Shard
        id: collector
        env:
          JOB_RADAR_SCHEDULE_ENABLED: 'true'
        run: |
          # The wrapper accepts partial source failures and still preserves the shard state.
          python scripts/ci_collect.py collect \
            --data-dir data \
            --public-dir public \
            --source-pack "${{ matrix.pack }}" \
            --pages 5 \
            --days 30 \
            --refresh-hours 72 \
            --detail-timeout 8 \
            --detail-retries 1 \
            --detail-failure-limit 6 \
            --source-budget 180 \
            --shard-budget 1080

      - name: Upload Shard State
        timeout-minutes: 3
        if: ${{ always() && (steps.collector.outcome == 'success' || steps.collector.outcome == 'failure') && hashFiles('data/state.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: collector-shard-${{ matrix.pack }}
          path: |
            data/state.json
            data/ci-report.json
          retention-days: 2

  merge-and-deploy:
    needs: [prepare-baseline, quality, collect-shards]
    if: ${{ !cancelled() && (needs.prepare-baseline.result == 'success' || inputs.deploy_only || inputs.reuse_run_id) && needs.quality.result == 'success' }}
    concurrency:
      group: cloudflare-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        if: ${{ !inputs.deploy_only }}
        run: python -m pip install -r requirements.txt

      - name: Download Collector Baseline
        if: ${{ !inputs.deploy_only }}
        uses: actions/download-artifact@v8
        with:
          name: collector-baseline
          path: data
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id || github.run_id }}

      - name: Download Collector Shards
        if: ${{ !inputs.deploy_only }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: collector-shard-*
          path: data/shards
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id || github.run_id }}

      - name: Merge Collector Shards
        if: ${{ !inputs.deploy_only }}
        id: merge
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          if [ -n "$REUSE_RUN_ID" ]; then
            python -c "from pathlib import Path; packs='regional-official universities-a finance large-enterprises public-leads'.split(); missing=[p for p in packs if not list((Path('data/shards')/('collector-shard-'+p)).rglob('state.json'))]; assert not missing, f'Recovery requires all shards: {missing}'"
          fi
          python scripts/ci_collect.py merge \
            --data-dir data \
            --public-dir public \
            --shards-dir data/shards \
            --days 30 \
            --expected-shards "regional-official,universities-a,finance,large-enterprises,public-leads"

      - name: Restore exact live snapshot for page-only deployment
        if: ${{ inputs.deploy_only }}
        run: python scripts/download_public.py --site https://sites-project.job-radar.workers.dev --public-dir data/live-public --repair-zhiye-urls --prefer-newer-exams-dir public

      - name: Audit actual data freshness and source coverage
        if: ${{ !inputs.deploy_only }}
        run: python scripts/audit_freshness.py --public-dir public --output data/freshness-report.json

      - name: Preserve freshest Civil Service Exams snapshot
        if: ${{ !inputs.deploy_only }}
        run: python scripts/exams_guard.py --public-dir public --site https://sites-project.job-radar.workers.dev --require-fresh

      - name: Save Collector State
        if: ${{ always() && steps.merge.outcome == 'success' && hashFiles('data/state.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            data/state.json
            data/published-baseline.json
          key: collector-state-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Collection Diagnostics
        if: ${{ always() && hashFiles('data/ci-report.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: collection-report-${{ github.run_attempt }}
          path: |
            data/ci-report.json
            data/coverage-changes.json
            data/freshness-report.json
          retention-days: 7

      - name: Download Built Application
        uses: actions/download-artifact@v8
        with:
          name: built-application
          path: dist

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build lightweight browsing index and first-screen edge snapshot
        env:
          SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN || 'https://sites-project.job-radar.workers.dev' }}
          TARGET_PUB: ${{ inputs.deploy_only && 'data/live-public' || 'public' }}
        run: |
          node --experimental-strip-types scripts/build_browse_index.mjs --public-dir "$TARGET_PUB"
          python scripts/build_feeds.py --public-dir "$TARGET_PUB" --site "$SITE_ORIGIN"
          python scripts/build_radar_sqlite.py --public-dir "$TARGET_PUB" --first-screen-only

      - name: Attach Validated Data to Application
        run: python scripts/stage_public.py --public-dir ${{ inputs.deploy_only && 'data/live-public' || 'public' }} --dist-dir dist

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes --package wrangler@4.92.0 wrangler deploy --config dist/server/wrangler.json --keep-vars

      - name: Decommission legacy Cloudflare D1 database if present
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = (os.environ.get('CLOUDFLARE_API_TOKEN') or '').strip()
          account = (os.environ.get('CLOUDFLARE_ACCOUNT_ID') or '').strip()
          if not token or not account:
              raise SystemExit(0)
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database'
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
          req = urllib.request.Request(f'{base}?name=job-radar-db', headers=headers)
          with urllib.request.urlopen(req, timeout=20) as resp:
              items = (json.loads(resp.read().decode('utf-8')).get('result') or [])
          for item in items:
              if isinstance(item, dict) and item.get('name') == 'job-radar-db' and item.get('uuid'):
                  del_req = urllib.request.Request(f"{base}/{item['uuid']}", headers=headers, method='DELETE')
                  with urllib.request.urlopen(del_req, timeout=20) as del_resp:
                      del_res = json.loads(del_resp.read().decode('utf-8'))
                  print(f"Deleted legacy Cloudflare D1 database job-radar-db ({item['uuid']}): success={del_res.get('success')}")
          PY
