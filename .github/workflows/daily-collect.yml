name: Daily Job Radar Pipeline

on:
  schedule:
    # 每天北京时间早晨 6:30 (UTC 22:30) 自动触发
    - cron: '30 22 * * *'
    # 每天北京时间晚上 18:30 (UTC 10:30) 自动触发
    - cron: '30 10 * * *'
  workflow_dispatch:
  # 每次你向 main 分支推送代码时自动构建部署
  push:
    branches:
      - main

concurrency:
  group: job-radar-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Restore one consistent historical baseline before the collection fan-out.
  prepare-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 openpyxl pymupdf

      - name: Restore Collector State
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: collector-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            collector-state-v2-

      - name: Restore Published Baseline
        run: python scripts/ci_collect.py prepare --site https://sites-project.job-radar.workers.dev

      - name: Upload Collector Baseline
        uses: actions/upload-artifact@v4
        with:
          name: collector-baseline
          path: |
            data/state.json
            data/ci-baseline.json
          retention-days: 2

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 openpyxl pymupdf

      - name: Test Collector and Publication Guards
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and Lint Frontend
        run: |
          npm run lint
          npx tsc --noEmit

  # Each shard starts from the same baseline and only updates its own sources.
  # Four concurrent runners keep wall-clock time bounded without hammering sites.
  collect-shards:
    needs: [prepare-baseline, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - pack: regional-official
          - pack: universities-a
          - pack: universities-b
          - pack: finance
          - pack: large-enterprises
          - pack: public-leads
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 openpyxl pymupdf

      - name: Download Collector Baseline
        uses: actions/download-artifact@v4
        with:
          name: collector-baseline
          path: data

      - name: Run Collector Shard
        id: collector
        env:
          JOB_RADAR_SCHEDULE_ENABLED: 'true'
        run: |
          # The wrapper accepts partial source failures and still preserves the shard state.
          python scripts/ci_collect.py collect \
            --data-dir data \
            --public-dir public \
            --source-pack "${{ matrix.pack }}" \
            --pages 5 \
            --days 30 \
            --refresh-hours 72 \
            --detail-timeout 8 \
            --detail-retries 1 \
            --detail-failure-limit 6

      - name: Upload Shard State
        if: ${{ always() && hashFiles('data/state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: collector-shard-${{ matrix.pack }}
          path: |
            data/state.json
            data/ci-report.json
          retention-days: 2

  merge-and-deploy:
    needs: [prepare-baseline, quality, collect-shards]
    if: ${{ always() && needs.prepare-baseline.result == 'success' && needs.quality.result == 'success' && needs.collect-shards.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install beautifulsoup4 openpyxl pymupdf

      - name: Download Collector Baseline
        uses: actions/download-artifact@v4
        with:
          name: collector-baseline
          path: data

      - name: Download Collector Shards
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: collector-shard-*
          path: data/shards
          merge-multiple: false

      - name: Merge Collector Shards
        id: merge
        run: |
          python scripts/ci_collect.py merge \
            --data-dir data \
            --public-dir public \
            --shards-dir data/shards \
            --days 30 \
            --expected-shards "regional-official,universities-a,universities-b,finance,large-enterprises,public-leads"

      - name: Save Collector State
        if: ${{ always() && steps.merge.outcome == 'success' && hashFiles('data/state.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: collector-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Collection Diagnostics
        if: ${{ always() && hashFiles('data/ci-report.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: collection-report-${{ github.run_attempt }}
          path: data/ci-report.json
          retention-days: 7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json --keep-vars
