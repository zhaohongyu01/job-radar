name: Daily Job Radar Pipeline

on:
  schedule:
    # 每天北京时间早晨 6:30 (UTC 22:30) 自动触发
    - cron: '30 22 * * *'
    # 每天北京时间中午 13:00 (UTC 05:00) 自动触发
    - cron: '0 5 * * *'
    # 每天北京时间晚上 18:30 (UTC 10:30) 自动触发
    - cron: '30 10 * * *'
  workflow_dispatch:
  # 每次你向 main 分支推送代码时自动构建部署
  push:
    branches:
      - main

concurrency:
  group: job-radar-pipeline
  cancel-in-progress: false

permissions:
  contents: read

env:
  JOB_RADAR_SCHEDULE_ENABLED: 'true'

jobs:
  # Restore one consistent historical baseline before the collection fan-out.
  prepare-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore Collector State
        uses: actions/cache/restore@v4
        with:
          path: |
            data/state.json
            data/published-baseline.json
          key: collector-state-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            collector-state-v3-

      - name: Restore Published Baseline
        run: python scripts/ci_collect.py prepare --site https://sites-project.job-radar.workers.dev

      - name: Upload Collector Baseline
        uses: actions/upload-artifact@v4
        with:
          name: collector-baseline
          path: |
            data/state.json
            data/ci-baseline.json
          retention-days: 2

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test Collector and Publication Guards
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck and Lint Frontend
        run: |
          node --experimental-strip-types --test tests/*.test.ts
          npm run lint
          npx tsc --noEmit

      - name: Build Web Application
        run: npm run build

      - name: Upload Built Application
        uses: actions/upload-artifact@v4
        with:
          name: built-application
          path: |
            dist
            !dist/client/jobs.json
            !dist/client/snapshot-manifest.json
            !dist/client/job-assets
            !dist/client/job-assets/**
          include-hidden-files: true
          retention-days: 2

  # Each shard starts from the same baseline and only updates its own sources.
  # Four concurrent runners keep wall-clock time bounded without hammering sites.
  collect-shards:
    needs: [prepare-baseline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - pack: regional-official
          - pack: universities-a
          - pack: universities-b
          - pack: finance
          - pack: large-enterprises
          - pack: public-leads
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Collector Baseline
        if: ${{ matrix.pack != 'universities-b' || vars.UNIVERSITIES_B_RUNNER != 'nas' }}
        uses: actions/download-artifact@v4
        with:
          name: collector-baseline
          path: data

      - name: Run Collector Shard
        if: ${{ matrix.pack != 'universities-b' || vars.UNIVERSITIES_B_RUNNER != 'nas' }}
        id: collector
        env:
          JOB_RADAR_SCHEDULE_ENABLED: 'true'
        run: |
          # The wrapper accepts partial source failures and still preserves the shard state.
          python scripts/ci_collect.py collect \
            --data-dir data \
            --public-dir public \
            --source-pack "${{ matrix.pack }}" \
            --pages 5 \
            --days 30 \
            --refresh-hours 72 \
            --detail-timeout 8 \
            --detail-retries 1 \
            --detail-failure-limit 6 \
            --source-budget 180 \
            --shard-budget 1080

      - name: Collect universities via NAS with bounded wait
        if: ${{ matrix.pack == 'universities-b' && vars.UNIVERSITIES_B_RUNNER == 'nas' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/nas_dispatch.py --output data

      - name: Upload Shard State
        if: ${{ always() && hashFiles('data/state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: collector-shard-${{ matrix.pack }}
          path: |
            data/state.json
            data/ci-report.json
          retention-days: 2

  merge-and-deploy:
    needs: [prepare-baseline, quality, collect-shards]
    if: ${{ !cancelled() && needs.prepare-baseline.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Collector Baseline
        uses: actions/download-artifact@v4
        with:
          name: collector-baseline
          path: data

      - name: Download Collector Shards
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: collector-shard-*
          path: data/shards
          merge-multiple: false

      - name: Merge Collector Shards
        id: merge
        run: |
          python scripts/ci_collect.py merge \
            --data-dir data \
            --public-dir public \
            --shards-dir data/shards \
            --days 30 \
            --expected-shards "regional-official,universities-a,universities-b,finance,large-enterprises,public-leads"

      - name: Save Collector State
        if: ${{ always() && steps.merge.outcome == 'success' && hashFiles('data/state.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/state.json
            data/published-baseline.json
          key: collector-state-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Collection Diagnostics
        if: ${{ always() && hashFiles('data/ci-report.json') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: collection-report-${{ github.run_attempt }}
          path: |
            data/ci-report.json
            data/coverage-changes.json
          retention-days: 7

      - name: Download Built Application
        uses: actions/download-artifact@v4
        with:
          name: built-application
          path: dist

      - name: Attach Validated Data to Application
        run: python scripts/stage_public.py --public-dir public --dist-dir dist

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes --package wrangler@4.92.0 wrangler deploy --config dist/server/wrangler.json --keep-vars
