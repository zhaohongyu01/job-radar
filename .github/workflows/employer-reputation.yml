name: Employer Reputation Pipeline

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      runner_mode:
        description: '采集运行节点（nas=国内自建节点直连牛客，cloud=云端备用）'
        type: choice
        options:
          - nas
          - cloud
        default: nas

permissions:
  contents: read

concurrency:
  group: job-radar-employer-reputation
  cancel-in-progress: false

jobs:
  prepare-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install small HTML parser dependency
        run: python -m pip install beautifulsoup4==4.14.3 soupsieve==2.8.3 typing_extensions==4.15.0
      - uses: actions/cache/restore@v6
        with:
          path: data/reputation/state.json
          key: employer-reputation-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: employer-reputation-v1-
      - name: Read public opportunities without waiting for recruitment collection
        continue-on-error: true
        run: timeout 55s python scripts/prepare_reputation_jobs.py
      - name: Prioritize public employers with aging and rotation
        run: |
          python -c "from pathlib import Path; p=Path('data/reputation/state.json'); p.parent.mkdir(parents=True, exist_ok=True); p.exists() or p.write_text('{\"schema_version\":1,\"enterprises\":{}}', encoding='utf-8')"
          node --experimental-strip-types scripts/build_reputation_queue.mjs data/reputation/jobs.json data/reputation/state.json data/reputation/queue.json
      - name: Upload reputation queue for collection
        uses: actions/upload-artifact@v7
        with:
          name: reputation-input
          path: |
            data/reputation/state.json
            data/reputation/queue.json
            data/reputation/jobs.json
          retention-days: 2

  collect-on-nas:
    needs: [prepare-queue]
    if: ${{ (inputs.runner_mode || vars.REPUTATION_RUNNER_MODE || 'nas') == 'nas' }}
    runs-on: [self-hosted, linux, job-radar-nas]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download reputation queue
        id: queue_download
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          name: reputation-input
          path: data/reputation
      - name: Retry reputation queue download
        if: ${{ steps.queue_download.outcome == 'failure' }}
        timeout-minutes: 3
        uses: actions/download-artifact@v8
        with:
          name: reputation-input
          path: data/reputation
      - name: Set up NAS Python environment
        timeout-minutes: 6
        run: python3 scripts/prepare_nas_python.py
      - name: Collect public employer pages on domestic network
        id: collector
        env:
          NO_PROXY: '*'
        run: |
          export no_proxy="$NO_PROXY"
          timeout 200s "$NAS_PYTHON" scripts/collect_reputation.py \
            --budget 180 --limit 30 \
            --queue data/reputation/queue.json \
            --state data/reputation/state.json \
            --report data/reputation/report.json
      - name: Upload collected reputation state
        timeout-minutes: 3
        if: ${{ always() && hashFiles('data/reputation/state.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reputation-collected
          path: |
            data/reputation/state.json
            data/reputation/report.json
          retention-days: 2

  collect-on-cloud:
    needs: [prepare-queue]
    if: ${{ (inputs.runner_mode || vars.REPUTATION_RUNNER_MODE || 'nas') == 'cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install small HTML parser dependency
        run: python -m pip install beautifulsoup4==4.14.3 soupsieve==2.8.3 typing_extensions==4.15.0
      - uses: actions/download-artifact@v8
        with:
          name: reputation-input
          path: data/reputation
      - name: Collect public employer pages within separate time budget
        run: |
          timeout 195s python scripts/collect_reputation.py \
            --budget 180 --limit 30 \
            --queue data/reputation/queue.json \
            --state data/reputation/state.json \
            --report data/reputation/report.json
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('data/reputation/state.json') != '' }}
        with:
          name: reputation-collected
          path: |
            data/reputation/state.json
            data/reputation/report.json
          retention-days: 2

  publish:
    needs: [prepare-queue, collect-on-nas, collect-on-cloud]
    if: ${{ !cancelled() && needs.prepare-queue.result == 'success' && (needs.collect-on-nas.result == 'success' || needs.collect-on-nas.result == 'failure' || needs.collect-on-cloud.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Download queue and collected state
        id: download_collected
        uses: actions/download-artifact@v8
        with:
          name: reputation-input
          path: data/reputation
      - name: Overlay collected reputation state
        uses: actions/download-artifact@v8
        with:
          name: reputation-collected
          path: data/reputation-collected
      - name: Merge collected files into workspace
        run: |
          cp -f data/reputation-collected/state.json data/reputation/state.json
          if [ -f data/reputation-collected/report.json ]; then
            cp -f data/reputation-collected/report.json data/reputation/report.json
          fi
      - name: Build attributed opinion summaries and bounded scores
        run: node --experimental-strip-types scripts/build_reputation.mjs data/reputation/state.json data/reputation/public
      - name: Publish data branch without deploying the website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_reputation.py --public-dir data/reputation/public --report data/reputation/publication-report.json
      - name: Audit actual active-employer evidence gaps
        run: node --experimental-strip-types scripts/audit_employer_coverage.mjs data/reputation/jobs.json data/reputation/public/index.json data/reputation/employer-coverage.json
      - name: Report actual source coverage
        if: ${{ always() && hashFiles('data/reputation/report.json') != '' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('data/reputation/report.json').read_text())
          lines = ['## 企业口碑独立采集',
                   f"用时 {report['elapsed_seconds']} 秒；请求 {report['requests']} 次；尝试 {report['attempted']} 家；成功读取 {report['successes']} 家；失败页面 {report['failures']} 个；缓存跳过 {report['cached']} 家。"]
          index_path = Path('data/reputation/public/index.json')
          if index_path.exists():
              rows = json.loads(index_path.read_text())['entities']
              lines += [f"本机状态包含 {len(rows)} 家资料（不是数据分支累计覆盖）。"]
          published_path = Path('data/reputation/publication-report.json')
          if published_path.exists():
              published = json.loads(published_path.read_text())
              if published.get('published'):
                  lines += [f"发布后累计 {published['enterprises']} 家资料、{published['with_content']} 家有内容；确认员工体验 {published['experiences']} 条、面经 {published['interviews']} 条、求助 {published['questions']} 条、归属待核对 {published['unattributed']} 条、综合分 {published['scored']} 家。公开页为部分收录，不等于全平台覆盖。"]
          if report.get('errors') or report.get('failures'):
              lines += ['部分页面不可用；已保留旧记录及原读取时间，任务成功不代表全部来源读取成功。']
          if report['errors']:
              print('::warning::Some reputation pages were unavailable; prior evidence has been retained. See collection report.')
          queue_path = Path('data/reputation/queue.json')
          coverage_path = Path('data/reputation/employer-coverage.json')
          if coverage_path.exists():
              coverage = json.loads(coverage_path.read_text())
              lines += [f"在招企业范围 {coverage['active_employers']} 个；输入完整：{coverage['input_complete']}；评价缺口分类：{json.dumps(coverage['gaps'], ensure_ascii=False)}。集团参考不算精确企业评价，面经不算员工体验。"]
          if queue_path.exists():
              queue = json.loads(queue_path.read_text())
              lines += [f"公开岗位输入 {queue['input_opportunities']} 条；匹配到已登记评价页 {queue['matched_enterprises']} 家；尚待核对来源对应 {queue['unmatched_enterprises']} 个企业范围。这不是已取得评价的企业数。"]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n\n'.join(lines) + '\n')
          PY
      - uses: actions/cache/save@v6
        if: ${{ always() && hashFiles('data/reputation/state.json') != '' }}
        with:
          path: data/reputation/state.json
          key: employer-reputation-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('data/reputation/report.json') != '' }}
        with:
          name: employer-reputation-report
          path: |
            data/reputation/report.json
            data/reputation/publication-report.json
            data/reputation/queue.json
            data/reputation/employer-coverage.json
            data/reputation/public/index.json
          retention-days: 7
