name: Civil Service Exams Pipeline

on:
  schedule:
    # 09:30, 15:30, 20:30 Asia/Shanghai (UTC+8) — aligned with official government portal publishing windows
    - cron: '30 1,7,12 * * *'
  workflow_dispatch:
    inputs:
      runner_mode:
        description: '采集运行节点（nas=国内自建节点直连政务网，cloud=云端备用）'
        type: choice
        options:
          - nas
          - cloud
        default: nas

permissions:
  contents: read

jobs:
  prepare-and-build:
    if: ${{ github.event_name != 'schedule' || vars.RUN_SCHEDULED_COLLECTION != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Web Application
        env:
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
        run: npm run build

      - name: Upload Built Application
        uses: actions/upload-artifact@v7
        with:
          name: built-application
          path: |
            dist
            !dist/client/jobs.json
            !dist/client/snapshot-manifest.json
            !dist/client/job-assets
            !dist/client/job-assets/**
          include-hidden-files: true
          retention-days: 2

      - name: Prepare compact exam seed from live snapshot
        run: |
          python scripts/download_public.py --site https://sites-project.job-radar.workers.dev --public-dir data/live-public --prefer-newer-exams-dir public
          python scripts/collect_exams.py --public-dir data/live-public --offline-only --live-site ""
          mkdir -p data/exams-seed/exam-assets
          cp -f data/live-public/exams.json data/exams-seed/exams.json
          cp -rf data/live-public/exam-assets/. data/exams-seed/exam-assets/

      - name: Upload compact exam seed for NAS
        uses: actions/upload-artifact@v7
        with:
          name: exams-seed
          path: |
            data/exams-seed/exams.json
            data/exams-seed/exam-assets
          retention-days: 2

  collect-exams-on-nas:
    needs: [prepare-and-build]
    if: ${{ (inputs.runner_mode || vars.EXAMS_RUNNER_MODE || 'nas') == 'nas' }}
    runs-on: [self-hosted, linux, job-radar-nas]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download compact exam seed
        id: seed_download
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/download-artifact@v8
        with:
          name: exams-seed
          path: data/exams-work

      - name: Retry compact exam seed download
        if: ${{ steps.seed_download.outcome == 'failure' }}
        timeout-minutes: 4
        uses: actions/download-artifact@v8
        with:
          name: exams-seed
          path: data/exams-work

      - name: Set up NAS Python environment
        timeout-minutes: 6
        run: python3 scripts/prepare_nas_python.py

      - name: Collect Civil Service & Public Institution Exams on domestic network
        id: collector
        continue-on-error: true
        timeout-minutes: 12
        env:
          NO_PROXY: '*'
        run: |
          export no_proxy="$NO_PROXY"
          "$NAS_PYTHON" scripts/collect_exams.py --public-dir data/exams-work --live-site ""

      - name: Upload NAS collected exams snapshot
        timeout-minutes: 3
        if: ${{ always() && hashFiles('data/exams-work/exams.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: exams-collected
          path: |
            data/exams-work/exams.json
            data/exams-work/exam-assets
          retention-days: 2

  deploy-exams:
    needs: [prepare-and-build, collect-exams-on-nas]
    if: ${{ !cancelled() && needs.prepare-and-build.result == 'success' && (needs.collect-exams-on-nas.result == 'success' || needs.collect-exams-on-nas.result == 'failure' || needs.collect-exams-on-nas.result == 'skipped') }}
    concurrency:
      group: cloudflare-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Download Built Application
        uses: actions/download-artifact@v8
        with:
          name: built-application
          path: dist

      - name: Download exact live jobs snapshot
        run: python scripts/download_public.py --site https://sites-project.job-radar.workers.dev --public-dir data/live-public --prefer-newer-exams-dir public

      - name: Download NAS collected exams snapshot
        if: ${{ (inputs.runner_mode || vars.EXAMS_RUNNER_MODE || 'nas') == 'nas' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: exams-collected
          path: data/exams-collected

      - name: Merge NAS exams snapshot or run cloud fallback
        run: |
          if [ -f data/exams-collected/exams.json ] && [ -d data/exams-collected/exam-assets ]; then
            echo "Applying NAS-collected civil exam snapshot..."
            rm -rf data/live-public/exam-assets
            mkdir -p data/live-public/exam-assets
            cp -f data/exams-collected/exams.json data/live-public/exams.json
            cp -rf data/exams-collected/exam-assets/. data/live-public/exam-assets/
          else
            echo "::warning::NAS exam snapshot unavailable; running cloud fallback collection."
            python scripts/collect_exams.py --public-dir data/live-public || true
          fi

      - name: Guard exams snapshot quality
        run: python scripts/exams_guard.py --public-dir data/live-public --site https://sites-project.job-radar.workers.dev

      - name: Build lightweight browsing index and static feeds
        env:
          SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN || 'https://sites-project.job-radar.workers.dev' }}
        run: |
          node --experimental-strip-types scripts/build_browse_index.mjs --public-dir data/live-public
          python scripts/build_feeds.py --public-dir data/live-public --site "$SITE_ORIGIN"

      - name: Provision and incrementally sync Cloudflare D1 exams index
        if: ${{ vars.DISABLE_CF_D1 != 'true' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME || 'job-radar-db' }}
        run: |
          python scripts/build_radar_sqlite.py --public-dir data/live-public --output-sqlite data/radar.sqlite
          python scripts/sync_cloudflare_d1.py --sqlite-path data/radar.sqlite --wrangler-config dist/server/wrangler.json --mode exams-only

      - name: Attach Validated Data to Application
        run: python scripts/stage_public.py --public-dir data/live-public --dist-dir dist

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes --package wrangler@4.92.0 wrangler deploy --config dist/server/wrangler.json --keep-vars
