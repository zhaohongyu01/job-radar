name: NAS Universities Collector
run-name: NAS universities-b ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      parent_run_id:
        required: true
        type: string
      parent_attempt:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      expires_at:
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: nas-universities-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ vars.UNIVERSITIES_B_RUNNER == 'nas' && github.event.repository.private }}
    runs-on: [self-hosted, linux, job-radar-nas]
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: '4'
      GIT_CONFIG_KEY_0: 'http.version'
      GIT_CONFIG_VALUE_0: 'HTTP/1.1'
      GIT_CONFIG_KEY_1: 'http.postBuffer'
      GIT_CONFIG_VALUE_1: '524288000'
      GIT_CONFIG_KEY_2: 'http.lowSpeedLimit'
      GIT_CONFIG_VALUE_2: '1000'
      GIT_CONFIG_KEY_3: 'http.lowSpeedTime'
      GIT_CONFIG_VALUE_3: '60'
      GIT_CONFIG_PARAMETERS: "'http.version=HTTP/1.1' 'http.postBuffer=524288000' 'http.lowSpeedLimit=1000' 'http.lowSpeedTime=60'"
    steps:
      - name: Validate parent and expiry before checkout
        uses: actions/github-script@v7
        env:
          PARENT_ID: ${{ inputs.parent_run_id }}
          PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          EXPIRES_AT: ${{ inputs.expires_at }}
        with:
          script: |
            const e = process.env;
            if (!/^\d+$/.test(e.PARENT_ID) || !/^\d+$/.test(e.PARENT_ATTEMPT) ||
                !/^[a-f0-9]{40}$/.test(e.SOURCE_SHA) || !/^\d+$/.test(e.EXPIRES_AT) ||
                e.REQUEST_ID !== `${e.PARENT_ID}-${e.PARENT_ATTEMPT}` ||
                Date.now() >= Number(e.EXPIRES_AT) * 1000) {
              throw new Error('Invalid or expired NAS request');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(e.PARENT_ID)});
            core.info(`Parent run: status=${run.status}, sha=${run.head_sha}, attempt=${run.run_attempt}, path=${run.path}, name=${run.name}`);
            const runPath = (run.path || '').split('@')[0];
            const isPathValid = Boolean(runPath && runPath.endsWith('daily-collect.yml'));
            const isNameValid = !run.name || run.name === 'Daily Job Radar Pipeline';
            const activeStatuses = ['in_progress', 'queued', 'waiting', 'pending', 'requested'];
            if (!activeStatuses.includes(run.status) || run.conclusion ||
                run.head_sha !== e.SOURCE_SHA ||
                run.run_attempt !== Number(e.PARENT_ATTEMPT) ||
                !isPathValid || !isNameValid) {
              throw new Error(`Parent run validation failed: status=${run.status}, sha=${run.head_sha}, attempt=${run.run_attempt}, path=${run.path}, name=${run.name}`);
            }

      - name: Configure Git network resilience for NAS runner
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

      - name: Checkout exact parent revision
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_KEY_0: 'http.version'
          GIT_CONFIG_VALUE_0: 'HTTP/1.1'
          GIT_CONFIG_KEY_1: 'http.postBuffer'
          GIT_CONFIG_VALUE_1: '524288000'
          GIT_CONFIG_KEY_2: 'http.lowSpeedLimit'
          GIT_CONFIG_VALUE_2: '1000'
          GIT_CONFIG_KEY_3: 'http.lowSpeedTime'
          GIT_CONFIG_VALUE_3: '60'
          GIT_CONFIG_PARAMETERS: "'http.version=HTTP/1.1' 'http.postBuffer=524288000' 'http.lowSpeedLimit=1000' 'http.lowSpeedTime=60'"
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Check Python and install collector dependencies
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 12)"
          python -m venv .nas-venv
          .nas-venv/bin/python -m pip install -i https://mirrors.aliyun.com/pypi/simple/ -r requirements.txt || .nas-venv/bin/python -m pip install -r requirements.txt

      - name: Download exact parent baseline
        uses: actions/download-artifact@v4
        with:
          name: collector-baseline
          path: data
          github-token: ${{ github.token }}
          run-id: ${{ inputs.parent_run_id }}

      - name: Collect universities on NAS
        id: collect
        env:
          JOB_RADAR_SCHEDULE_ENABLED: 'true'
          NO_PROXY: '*'
        run: |
          # Actions env keys are case-insensitive; set the lowercase alias in shell.
          export no_proxy="$NO_PROXY"
          .nas-venv/bin/python scripts/ci_collect.py collect \
            --source-pack universities-b --data-dir data --public-dir public \
            --pages 2 --days 30 --refresh-hours 72 --probe-budget 1 \
            --detail-timeout 8 --detail-retries 1 --detail-failure-limit 6 \
            --source-budget 120 --shard-budget 1500

      - name: Upload NAS delta
        if: ${{ always() && steps.collect.outcome != 'skipped' && hashFiles('data/state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nas-universities-b
          path: |
            data/state.json
            data/ci-report.json
          retention-days: 2
