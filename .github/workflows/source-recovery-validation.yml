name: Source Recovery Validation
on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: 'Successful run containing the requested source baseline artifact'
        type: string
        required: true
      validation_target:
        description: 'Bounded source trial; never publishes collected data'
        type: choice
        options:
          - recovery
          - freshness
          - sdnu-calendar
        default: recovery
permissions:
  contents: read
  actions: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: cloud
            runner: '["ubuntu-latest"]'
          - node: nas
            runner: '["self-hosted", "linux", "job-radar-nas"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: ${{ matrix.node == 'cloud' }}
        with:
          python-version: '3.12'
      - if: ${{ matrix.node == 'cloud' }}
        run: python3 -m pip install beautifulsoup4==4.14.3 soupsieve==2.8.3 typing_extensions==4.15.0
      - if: ${{ matrix.node == 'nas' }}
        run: python3 -m pip install --index-url https://mirrors.aliyun.com/pypi/simple --timeout 10 --retries 0 beautifulsoup4==4.14.3 soupsieve==2.8.3 typing_extensions==4.15.0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ (inputs.validation_target == 'freshness' || inputs.validation_target == 'sdnu-calendar') && 'collector-baseline' || 'collector-shard-universities-a' }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
          path: data/source-validation
      - name: Bound collection to two sources without publication
        if: ${{ inputs.validation_target != 'freshness' && inputs.validation_target != 'sdnu-calendar' }}
        env:
          NO_PROXY: '*'
        run: |
          export no_proxy="$NO_PROXY"
          python3 scripts/ci_collect.py collect --sources nankai,hdu-talks \
            --data-dir data/source-validation --public-dir data/source-validation/public \
            --pages 5 --days 30 --refresh-hours 72 --probe-budget 0 \
            --detail-timeout 6 --detail-retries 0 --source-budget 60 --shard-budget 130
      - name: Validate newest-page preservation and bounded provincial feed
        if: ${{ inputs.validation_target == 'freshness' }}
        env:
          NO_PROXY: '*'
        run: |
          export no_proxy="$NO_PROXY"
          python3 scripts/ci_collect.py collect --sources lyu-positions,sdei-news \
            --data-dir data/source-validation --public-dir data/source-validation/public \
            --pages 2 --days 30 --refresh-hours 72 --probe-budget 0 --freshness-first \
            --detail-timeout 6 --detail-retries 0 --source-budget 30 --shard-budget 75
      - name: Check one SDNU public calendar list on the normal node route
        if: ${{ inputs.validation_target == 'sdnu-calendar' }}
        run: python3 scripts/diagnose_sdnu_calendar.py --state data/source-validation/state.json --report data/source-validation/ci-report.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: source-recovery-validation-${{ matrix.node }}
          path: data/source-validation/ci-report.json
          retention-days: 3
