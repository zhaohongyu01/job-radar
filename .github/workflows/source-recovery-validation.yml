name: Source Recovery Validation
on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: 'Successful Daily run containing the universities-a shard'
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3 soupsieve==2.8.3 typing_extensions==4.15.0
      - uses: actions/download-artifact@v4
        with:
          name: collector-shard-universities-a
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
          path: data/source-validation
      - name: Bound collection to two sources without publication
        run: |
          python scripts/ci_collect.py collect --sources nankai,hdu-talks \
            --data-dir data/source-validation --public-dir data/source-validation/public \
            --pages 5 --days 30 --refresh-hours 72 --probe-budget 0 \
            --detail-timeout 6 --detail-retries 0 --source-budget 60 --shard-budget 130
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: source-recovery-validation
          path: data/source-validation/ci-report.json
          retention-days: 3
